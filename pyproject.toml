[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demandfcst"
version = "0.1.0"
description = "Weekly demand forecasting for a beverage company"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "fsspec>=2024.2",
    "s3fs>=2024.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[locations.local]
landing = "landing"
generator = "data/generator"
truth = "data/truth"
reports = "outputs/reports"

[locations.s3]
landing = "s3://{bucket}/landing"
generator = "s3://{bucket}/generator"
truth = "s3://{bucket}/truth"
reports = "s3://{bucket}/reports"


